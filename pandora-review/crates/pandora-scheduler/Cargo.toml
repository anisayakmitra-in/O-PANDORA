[package]
name = "pandora-scheduler"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
uuid = { version = "1.4", features = ["v4", "serde"] }
futures = "0.3"
async-trait = "0.1"

pandora-sandbox = { path = "../pandora-sandbox" }

pandora-governance = { path = "../pandora-governance" }

# Assume workspace dependencies
# pandora-governance = { path = "../pandora-governance" }
