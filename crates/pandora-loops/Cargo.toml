[package]
name = "pandora-loops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pandora cognition loop registry"

[dependencies]
pandora-narad = { path = "../pandora-narad" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
