[package]
name = "pandora-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Default features: none. The crate compiles as a pure contract crate.
default = ["llamacpp"]
# TEMPORARY: enables the legacy Ollama HTTP client.
# Will be removed when the plugin architecture lands.
llamacpp = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:futures-util",
    "tokio/full",
]

legacy-ollama = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:toml",
    "dep:futures-util",
    "tokio/full",
]

[dependencies]
async-trait = "0.1"
pandora-types = { path = "../pandora-types" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# `rt` enables the async runtime, `sync` enables RwLock/Mutex/oneshot/mpsc.
# These are needed for the Provider trait itself (not just the legacy impl).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
# CancellationToken is part of the Provider trait signature, so it is
# always required.
tokio-util = "0.7"

# Optional dependencies, only used by the legacy Ollama implementation.
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
# `macros` enables the #[tokio::main] attribute used in the examples.
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[[example]]
name = "test_ollama"
required-features = ["legacy-ollama"]

[[example]]
name = "test_streaming"
required-features = ["legacy-ollama"]

[[example]]
name = "test_registry"
required-features = ["legacy-ollama"]
