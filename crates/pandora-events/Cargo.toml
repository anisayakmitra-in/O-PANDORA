[package]
name = "pandora-events"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# `rt` enables the async runtime, `sync` enables the bus's RwLock
# and mpsc channels.
tokio = { version = "1", features = ["rt", "sync"] }
# Required for the async Publisher/Subscriber traits.
async-trait = "0.1"
# Required by Event, EventMetadata, EventPriority, EventCategory,
# EventEnvelope, and the legacy RuntimeEvent compat type.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
pandora-types = { path = "../pandora-types" }
