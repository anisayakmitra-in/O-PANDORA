[package]
name = "pandora-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
libloading = "0.8"

anubis-memory = { path = "../anubis-memory" }
pandora-telemetry = { path = "../pandora-telemetry" }
pandora-benchmark-runtime = { path = "../pandora-benchmark-runtime" }
pandora-capability = { path = "../pandora-capability" }
pandora-loop-detection = { path = "../pandora-loop-detection" }
pandora-checkpoint = { path = "../pandora-checkpoint" }
pandora-config = { path = "../pandora-config" }
pandora-contract = { path = "../pandora-contract" }
pandora-dag = { path = "../pandora-dag" }
