[package]
name = "pandora-parliament"
version = "0.1.0"
edition = "2021"

[dependencies]
pandora-types = { path = "../pandora-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "1"
tracing = "0.1"
