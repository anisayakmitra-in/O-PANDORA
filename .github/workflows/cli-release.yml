name: CLI release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --tests -- --test-threads=1
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_docs.py
      - run: python -m unittest scripts/test_installers.py

  build:
    needs: validate
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pandora-linux-x86_64
            binary: pandora
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: pandora-macos-x86_64
            binary: pandora
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pandora-macos-arm64
            binary: pandora
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pandora-windows-x86_64.exe
            binary: pandora.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: pandora-windows-arm64.exe
            binary: pandora.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "Release tags must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%%-rc.*}"
          package_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pandora"))')"
          test "$base_version" = "$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match workspace version $package_version" >&2
            exit 1
          }
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p pandora
      - name: Prepare release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$ASSET" > "dist/$ASSET.sha256"
          else
            shasum -a 256 "dist/$ASSET" > "dist/$ASSET.sha256"
          fi
          printf '{"version":"%s","target":"%s","commit":"%s"}\n' "$VERSION" "$ASSET" "$COMMIT" > "dist/$ASSET.metadata.json"
      - name: Attest CLI binary
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish CLI release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true
      - name: Generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > dist/pandora-build-commit.txt
          python scripts/generate_sbom.py dist/pandora-sbom.cdx.json
          python scripts/verify_release.py dist --require-cli-platforms linux,macos,windows
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "O-PANDORA $GITHUB_REF_NAME"