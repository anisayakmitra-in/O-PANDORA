name: CLI release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pandora-linux-x86_64
            binary: pandora
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: pandora-macos-x86_64
            binary: pandora
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pandora-macos-arm64
            binary: pandora
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pandora-windows-x86_64.exe
            binary: pandora.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: pandora-windows-arm64.exe
            binary: pandora.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%%-rc.*}"
          package_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pandora"))')"
          test "$base_version" = "$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match workspace version $package_version" >&2
            exit 1
          }
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p pandora
      - name: Prepare release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$ASSET" > "dist/$ASSET.sha256"
          else
            shasum -a 256 "dist/$ASSET" > "dist/$ASSET.sha256"
          fi
          printf '{"version":"%s","target":"%s","commit":"%s"}\n' "$VERSION" "$ASSET" "$COMMIT" > "dist/$ASSET.metadata.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish CLI release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "O-PANDORA $GITHUB_REF_NAME"