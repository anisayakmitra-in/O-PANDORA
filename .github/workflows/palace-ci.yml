name: Palace CI

on: [push, pull_request]

jobs:
  validate-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every package has gene.toml or harness.toml
        run: |
          errors=0
          for dir in */; do
            if [ -f "$dir/gene.toml" ] || [ -f "$dir/harness.toml" ]; then
              echo "  OK $dir"
            else
              echo "  FAIL $dir (missing gene.toml or harness.toml)"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors package(s) missing manifest"
            exit 1
          fi
          echo "All packages have valid manifests"

      - name: Validate manifest fields
        run: |
          errors=0
          for dir in */; do
            manifest=""
            [ -f "$dir/gene.toml" ] && manifest="$dir/gene.toml"
            [ -f "$dir/harness.toml" ] && manifest="$dir/harness.toml"
            if [ -n "$manifest" ]; then
              for field in id name kind version author description; do
                if ! grep -q "^$field " "$manifest" && ! grep -q "^$field =" "$manifest"; then
                  echo "  FAIL $dir: missing required field '$field'"
                  errors=$((errors + 1))
                fi
              done
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors validation errors"
            exit 1
          fi
          echo "All manifests have required fields"

      - name: Verify README exists
        run: |
          for dir in */; do
            if [ ! -f "$dir/README.md" ]; then
              echo "  FAIL $dir: missing README.md"
              exit 1
            fi
            echo "  OK $dir"
          done
          echo "All packages have README.md"

      - name: Count packages
        run: |
          count=$(find . -maxdepth 2 -name "gene.toml" -o -name "harness.toml" | wc -l)
          echo "Total packages: $count"
          if [ "$count" -lt 10 ]; then
            echo "Expected at least 10 seed packages, found $count"
            exit 1
          fi
