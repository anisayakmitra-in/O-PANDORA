name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'tagged-release' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v4.2.2
      - uses: actions/setup-python@v5  # v5.3.0
        with:
          python-version: '3.11'
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_docs.py

  script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $parseErrors += $errors
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
  test:
    needs: [validate, script-syntax]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable  # v1.0
      - run: rustup component add clippy rustfmt
      - name: Build desktop frontend
        working-directory: pandora-desktop
        run: npm ci
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check desktop frontend
        working-directory: pandora-desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --tests -- --test-threads=1
      - run: cargo build --release -p pandora
      - name: Validate release contract
        run: python scripts/validate_repo.py
      - run: cargo check --examples -p pandora-types

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p pandora
      - name: Exercise authenticated runtime API
        shell: bash
        env:
          PANDORA_API_TOKEN: ci-runtime-token
        run: |
          set -euo pipefail
          target/release/pandora serve 127.0.0.1:19090 >runtime-smoke.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19090/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 40 ]; then
              cat runtime-smoke.log
              exit 1
            fi
            sleep 0.25
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:19090/api/v1/node)" = 401
          curl --fail --silent --header 'Authorization: Bearer ci-runtime-token' \
            http://127.0.0.1:19090/api/v1/node | grep -q '"node_id"'
