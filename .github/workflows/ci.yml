name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v4.2.2
      - uses: actions/setup-python@v5  # v5.3.0
        with:
          python-version: '3.11'
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_docs.py

  test:
    needs: [validate]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable  # v1.0
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p pandora -p pandora-tui
      - run: cargo check --examples -p pandora-types

  release:
    runs-on: ${{ matrix.os }}
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # needed for release upload
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p pandora -p pandora-tui
      - name: Upload artifacts
        uses: softprops/action-gh-release@v1  # v1.0.15
        with:
          files: |
            target/release/pandora
            target/release/pandora-tui
