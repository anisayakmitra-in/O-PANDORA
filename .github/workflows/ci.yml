name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust workspace gates (Linux) ──
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release -p pandora

  # ── Linux Desktop AppImage ──
  build-linux:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libappindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop
        run: |
          cd pandora-desktop
          npm install
          npx tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: pandora-linux
          path: target/release/bundle/appimage/*.AppImage

  # ── macOS Desktop ──
  build-macos:
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop
        run: |
          cd pandora-desktop
          npm install
          npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: pandora-macos
          path: target/release/bundle/dmg/*.dmg

  # ── Windows Desktop MSI/NSIS ──
  build-windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop
        run: |
          cd pandora-desktop
          npm install
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pandora-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
