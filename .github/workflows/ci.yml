name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v4.2.2
      - uses: actions/setup-python@v5  # v5.3.0
        with:
          python-version: '3.11'
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_docs.py

  test:
    needs: [validate]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable  # v1.0
      - run: rustup component add clippy rustfmt
      - name: Build desktop frontend
        working-directory: pandora-desktop
        run: npm ci
      - name: Check desktop frontend
        working-directory: pandora-desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release -p pandora
      - name: Validate release contract
        run: python scripts/validate_repo.py
      - run: cargo check --examples -p pandora-types

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p pandora
      - name: Exercise authenticated runtime API
        shell: bash
        env:
          PANDORA_API_TOKEN: ci-runtime-token
        run: |
          set -euo pipefail
          target/release/pandora serve 127.0.0.1:19090 >runtime-smoke.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19090/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 40 ]; then
              cat runtime-smoke.log
              exit 1
            fi
            sleep 0.25
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:19090/api/v1/node)" = 401
          curl --fail --silent --header 'Authorization: Bearer ci-runtime-token' \
            http://127.0.0.1:19090/api/v1/node | grep -q '"node_id"'

  release:
    runs-on: ${{ matrix.os }}
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p pandora
      - name: Name Unix binary
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then NAME=pandora-linux-x86_64; else NAME=pandora-macos-x86_64; fi
          cp target/release/pandora "$NAME"
          echo "ARTIFACT_PATH=$NAME" >> "$GITHUB_ENV"
      - name: Name Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/pandora.exe pandora-windows-x86_64.exe
          "ARTIFACT_PATH=pandora-windows-x86_64.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate checksum
        if: runner.os != 'Windows'
        run: sha256sum "${{ env.ARTIFACT_PATH }}" > "${{ env.ARTIFACT_PATH }}.sha256" || shasum -a 256 "${{ env.ARTIFACT_PATH }}" > "${{ env.ARTIFACT_PATH }}.sha256"
      - name: Generate Windows checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-FileHash "${{ env.ARTIFACT_PATH }}" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  ${{ env.ARTIFACT_PATH }}" } | Out-File -Encoding ascii "${{ env.ARTIFACT_PATH }}.sha256"
      - name: Smoke-test Unix binary
        if: runner.os != 'Windows'
        run: './${{ env.ARTIFACT_PATH }} --version'
      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\${{ env.ARTIFACT_PATH }}" --version'
      - name: Attest CLI binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ARTIFACT_PATH }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandora-cli-${{ runner.os }}
          path: |
            ${{ env.ARTIFACT_PATH }}
            ${{ env.ARTIFACT_PATH }}.sha256
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pandora-cli-*
          path: release-assets
          merge-multiple: true
      - name: Generate release metadata
        run: |
          python scripts/generate_sbom.py release-assets/pandora-sbom.cdx.json
          git rev-parse HEAD > release-assets/pandora-build-commit.txt
      - name: Verify release assets
        run: python scripts/verify_release.py release-assets --require-cli-platforms linux,macos,windows
      - name: Publish one release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/pandora-*
