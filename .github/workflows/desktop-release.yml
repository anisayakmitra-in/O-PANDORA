name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'tagged-release' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAURI_SIGNING_ENABLED: ${{ secrets.TAURI_UPDATER_PUBKEY != '' && secrets.TAURI_UPDATER_ENDPOINT != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pandora-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: pandora-desktop
        run: npm ci
      - name: Prepare signed updater configuration
        if: startsWith(github.ref, 'refs/tags/') && env.TAURI_SIGNING_ENABLED == 'true'
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python scripts/prepare_tauri_release.py pandora-desktop/src-tauri/tauri.release.conf.json
      - name: Build signed Tauri bundle
        if: startsWith(github.ref, 'refs/tags/') && env.TAURI_SIGNING_ENABLED == 'true'
        working-directory: pandora-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.rust_target }} --config src-tauri/tauri.release.conf.json
      - name: Reject unsigned stable desktop release
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.') == false && env.TAURI_SIGNING_ENABLED != 'true'
        run: |
          echo 'Stable desktop releases require Tauri signing secrets.'
          exit 1
      - name: Build unsigned Tauri bundle
        if: startsWith(github.ref, 'refs/tags/') == false || env.TAURI_SIGNING_ENABLED != 'true'
        working-directory: pandora-desktop
        run: npm run tauri build -- --target ${{ matrix.rust_target }}
      - name: Generate desktop integrity metadata
        shell: bash
        run: |
          BUNDLE_DIR="pandora-desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then BUNDLE_DIR="pandora-desktop/src-tauri/target/release/bundle"; fi
          python scripts/generate_checksums.py "$BUNDLE_DIR" "pandora-desktop-${{ runner.os }}.sha256"
          git rev-parse HEAD > "pandora-desktop-${{ runner.os }}-build-commit.txt"
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: pandora-desktop-${{ runner.os }}
          path: |
            pandora-desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**
            pandora-desktop/src-tauri/target/release/bundle/**
            pandora-desktop-${{ runner.os }}.sha256
            pandora-desktop-${{ runner.os }}-build-commit.txt
          if-no-files-found: error

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-latest
            shell: bash
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
          - os: macos-latest
            shell: bash
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            shell: bash
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            shell: pwsh
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: windows-latest
            shell: pwsh
            target: aarch64-pc-windows-msvc
            name: windows-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI release on Unix
        if: runner.os != 'Windows'
        env:
          PANDORA_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: bash scripts/release.sh dist/releases
      - name: Build CLI release on Windows
        if: runner.os == 'Windows'
        env:
          PANDORA_TARGET: ${{ matrix.target }}
        run: ./scripts/release.ps1 -OutputDirectory dist/releases -Target ${{ matrix.target }}
      - name: Upload CLI release
        uses: actions/upload-artifact@v4
        with:
          name: pandora-cli-${{ matrix.name }}
          path: dist/releases/**
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build, cli]
    env:
      TAURI_SIGNING_ENABLED: ${{ secrets.TAURI_UPDATER_PUBKEY != '' && secrets.TAURI_UPDATER_ENDPOINT != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pandora-*
          path: release-assets
          merge-multiple: true
      - name: Verify desktop artifacts
        if: env.TAURI_SIGNING_ENABLED == 'true'
        run: python scripts/verify_desktop_release.py release-assets
      - name: Verify unsigned RC desktop artifacts
        if: env.TAURI_SIGNING_ENABLED != 'true'
        run: python scripts/verify_desktop_release.py release-assets --allow-unsigned
      - name: Generate CLI SBOM
        run: python scripts/generate_sbom.py release-assets/pandora-sbom.cdx.json
      - name: Verify CLI release artifacts
        run: python scripts/verify_release.py release-assets --require-cli-platforms linux,macos,windows
      - name: Publish one desktop release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: release-assets/**/*

