[package]
name = "pandora-palace"
version = "0.1.0"
edition = "2021"

[dependencies]
pandora-types = { path = "../pandora-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tower = "0.4"
