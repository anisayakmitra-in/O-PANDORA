[package]
name = "pandora-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anubis-memory = { path = "../anubis-memory" }
pandora-events = { path = "../pandora-events" }
pandora-governance = { path = "../pandora-governance", features = ["compat-runtime"] }
pandora-provider = { path = "../pandora-provider" }
pandora-tools = { path = "../pandora-tools" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

pandora-narad = { path = "../pandora-narad" }
pandora-loops = { path = "../pandora-loops" }

async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }

futures = "0.3"

pandora-rahu = { path = "../pandora-rahu" }
