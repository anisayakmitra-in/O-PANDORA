[workspace]
resolver = "2"

members = [
    "crates/pandora-gene",
    "crates/pandora-harness",
    "crates/pandora-memory",
    "crates/pandora-model",
    "crates/pandora-panoptikon",
    "crates/pandora-tui",
    "crates/pandora-types",
    "test-runner"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arka <arka@pandora.local>"]
license = "MIT"

[profile.release]
opt-level = 3
lto = true
