# Reference Package — pandora/coding-domain
#
# Coding domain harness — code review, audit, simplification.
#
# Install: pandora-kuber install pandora/coding-domain

[package]
id = "coding-domain"
name = "Coding Domain"
version = "0.2.0"
author = "pandora"
description = "Code review, audit, debt tracking, simplification — ponytail patterns"
kind = "domain-harness"
license = "Apache-2.0"
repository = "https://github.com/anisayakmitra-in/O-PANDORA"
pandora_version = ">=0.2.0"
tags = ["code-review", "audit", "quality", "simplification"]
categories = ["harness", "coding"]

[[package.harnesses]]
id = "coding-domain"
name = "Coding Domain"
kind = "domain"
description = "Code review, audit, debt tracking, simplification"

[[package.genes]]
id = "code-review"
name = "Code Review"
description = "Review code for bugs, patterns, and anti-patterns"

[[package.genes]]
id = "code-audit"
name = "Code Audit"
description = "Full repo audit — over-engineering, dead code, debt"

[[package.genes]]
id = "simplify-code"
name = "Simplify Code"
description = "Reduce complexity while preserving behavior"

[[package.genes]]
id = "debt-track"
name = "Debt Track"
description = "Track and prioritize technical debt"

[package.permissions]
allow = ["filesystem.read", "shell.execute"]
deny = ["filesystem.write", "network.external"]

[package.trust]
min_level = "publisher-verified"
require_source = true
require_audit = false
