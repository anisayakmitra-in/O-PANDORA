# Reference Package — pandora/security-domain
#
# Security domain harness — audit, scan, secrets, threat model.
#
# Install: pandora-kuber install pandora/security-domain

[package]
id = "security-domain"
name = "Security Domain"
version = "0.2.0"
author = "pandora"
description = "Security analysis — audit, scan, secrets, threat model"
kind = "domain-harness"
license = "Apache-2.0"
repository = "https://github.com/anisayakmitra-in/O-PANDORA"
pandora_version = ">=0.2.0"
tags = ["security", "audit", "scan", "secrets"]
categories = ["harness", "security"]

[[package.harnesses]]
id = "security-domain"
name = "Security Domain"
kind = "domain"
description = "Security analysis — audit, scan, secrets, threat model"

[[package.genes]]
id = "security-audit"
name = "Security Audit"
description = "Run security audit on codebase"

[[package.genes]]
id = "dependency-scan"
name = "Dependency Scan"
description = "Scan dependencies for vulnerabilities"

[[package.genes]]
id = "secrets-detection"
name = "Secrets Detection"
description = "Find secrets and credentials in code"

[[package.genes]]
id = "static-analysis"
name = "Static Analysis"
description = "Run static analysis for security issues"

[package.permissions]
allow = ["filesystem.read", "shell.execute"]
deny = ["filesystem.write", "network.external"]

[package.trust]
min_level = "signed"
require_source = true
require_audit = true
