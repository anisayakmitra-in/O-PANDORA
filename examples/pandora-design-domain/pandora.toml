# Reference Package — pandora/design-domain
#
# Design domain harness — UI/UX design, brand, color, typography, motion.
#
# Install: pandora-kuber install pandora/design-domain

[package]
id = "design-domain"
name = "Design Domain"
version = "0.2.0"
author = "pandora"
description = "UI/UX design — brand identity, color theory, typography, motion, accessibility"
kind = "domain-harness"
license = "Apache-2.0"
repository = "https://github.com/anisayakmitra-in/O-PANDORA"
pandora_version = ">=0.2.0"
tags = ["design", "ui", "ux", "brand", "color", "typography"]
categories = ["harness", "design"]

[[package.harnesses]]
id = "design-domain"
name = "Design Domain"
kind = "domain"
description = "UI/UX design — brand identity, color theory, typography, motion, accessibility"

[[package.genes]]
id = "design-review"
name = "Design Review"
description = "Review a design for consistency, patterns, and issues"

[[package.genes]]
id = "brand-identity"
name = "Brand Identity"
description = "Suggest brand identity elements"

[[package.genes]]
id = "color-theory"
name = "Color Theory"
description = "Suggest color palette from base color"

[[package.genes]]
id = "typography"
name = "Typography"
description = "Suggest typography pairings"

[[package.genes]]
id = "motion-design"
name = "Motion Design"
description = "Suggest animation patterns"

[[package.genes]]
id = "ui-patterns"
name = "UI Patterns"
description = "Suggest UI component patterns"

[[package.genes]]
id = "accessibility"
name = "Accessibility"
description = "Check accessibility compliance"

[package.permissions]
allow = ["filesystem.read"]
deny = ["shell.execute", "filesystem.write", "network.external"]

[package.trust]
min_level = "publisher-verified"
require_source = true
require_audit = false
