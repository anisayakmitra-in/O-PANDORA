[package]
id = "rust-tool"
name = "Rust Tool"
kind = "tool"
version = "0.2.0"
author = "pandora"
description = "Cargo subcommands — build, test, clippy, fmt"
homepage = "https://github.com/anisayakmitra-in/O-PANDORA"
